<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RyyZyrex Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron', sans-serif; }
body { background:#0f0f1f; overflow-x:hidden; }
.bg-animation {
  position: fixed; top:0; left:0;
  width:100%; height:100%;
  background: linear-gradient(270deg, #1e1e2f, #4b0082, #00ffff, #ff00ff);
  background-size: 800% 800%;
  animation: gradientBG 25s ease infinite;
  z-index:-1;
}
@keyframes gradientBG {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Login/Register */
.auth-container {
  width:400px; padding:2rem;
  background: rgba(0,0,0,0.75);
  border-radius:20px; text-align:center;
  position:absolute; top:50%; left:50%;
  transform:translate(-50%, -50%);
  box-shadow:0 0 50px #00ffff;
}
.auth-container h1 { margin-bottom:1.5rem; color:#00ffff; text-shadow:0 0 15px #00ffff; }
.auth-container input {
  width:85%; padding:0.8rem; margin:0.5rem 0;
  border:none; border-radius:12px; outline:none;
  background: rgba(255,255,255,0.05); color:#fff;
}
.auth-container input::placeholder { color: #ccc; }
.auth-container button {
  padding:0.8rem 2rem; border:none; border-radius:12px;
  background:#00ffff; color:#000; cursor:pointer; transition:0.3s;
  box-shadow:0 0 15px #00ffff;
  margin-top:0.5rem;
}
.auth-container button:hover { background:#ff00ff; color:#fff; box-shadow:0 0 25px #ff00ff; }
.switch-btn { background:none; color:#00ffff; text-decoration:underline; cursor:pointer; margin-top:10px; }
.switch-btn:hover { color:#ff00ff; }
.error-msg { color:#ff4d4d; margin-top:0.5rem; }

/* Dashboard */
.dashboard-container { padding:2rem; color:#fff; }
.dashboard-container header { display:flex; justify-content:space-between; align-items:center; }
.dashboard-container header h2 { text-shadow:0 0 10px #00ffff; }
.dashboard-container header button {
  padding:0.5rem 1rem; border:none; border-radius:10px;
  background:#ff00ff; color:#fff; cursor:pointer; transition:0.3s;
  box-shadow:0 0 10px #ff00ff;
}
.dashboard-container header button:hover { background:#00ffff; box-shadow:0 0 20px #00ffff; }

.actions { margin-top:2rem; }
.actions input, .actions select {
  padding:0.6rem; border-radius:10px; border:none;
  margin-right:0.5rem; background: rgba(255,255,255,0.05); color:#fff;
}
.actions input::placeholder { color: #ccc; }
.actions button {
  padding:0.6rem 1.5rem; margin-right:1rem; border:none; border-radius:12px;
  background:#00ffff; color:#000; cursor:pointer; transition:0.3s; box-shadow:0 0 10px #00ffff;
}
.actions button:hover { background:#ff00ff; color:#fff; box-shadow:0 0 20px #ff00ff; }

.panel-list { margin-top:2rem; }
table { width:100%; border-collapse: collapse; margin-top:1rem; }
th, td { padding:0.8rem; text-align:left; border-bottom:1px solid rgba(0,255,255,0.2); }
th { background: rgba(0,255,255,0.1); text-shadow:0 0 5px #00ffff; }
tr:hover { background: rgba(0,255,255,0.1); }

.bar-container { background: rgba(255,255,255,0.05); border-radius:8px; height:12px; width:100%; margin-top:5px; overflow:hidden; }
.bar { height:100%; border-radius:8px; transition: width 0.5s ease; }
.status-online { color:#0f0; text-shadow:0 0 5px #0f0; }
.status-offline { color:#f00; text-shadow:0 0 5px #f00; }
.status-suspended { color:#ffa500; text-shadow:0 0 5px #ffa500; }
.hidden { display:none; }
</style>
</head>
<body>
<div class="bg-animation"></div>

<!-- Auth Container -->
<div class="auth-container" id="authContainer">
  <h1 id="authTitle">Login - RyyZyrex Panel</h1>
  <form id="authForm">
    <input type="text" placeholder="Username" id="username" required>
    <input type="password" placeholder="Password" id="password" required>
    <button type="submit" id="authButton">Login</button>
  </form>
  <p class="error-msg" id="errorMsg"></p>
  <button class="switch-btn" id="switchAuth">Belum punya akun? Register</button>
</div>

<!-- Dashboard -->
<div class="dashboard-container hidden">
  <header>
    <h2>Selamat Datang, <span id="userName"></span></h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <section class="actions">
    <h3>Buat Panel Pterodactyl</h3>
    <input type="text" id="panelName" placeholder="Nama Panel" />
    <select id="panelType">
      <option value="1">Game Server</option>
      <option value="2">Bot Server</option>
    </select>
    <button id="createPanel">Buat Panel</button>
  </section>

  <section class="panel-list">
    <h3>Daftar Panel Real-Time</h3>
    <table>
      <thead>
        <tr>
          <th>Nama Panel</th>
          <th>Tipe</th>
          <th>Status</th>
          <th>CPU</th>
          <th>RAM</th>
          <th>Disk</th>
        </tr>
      </thead>
      <tbody id="panelList"></tbody>
    </table>
  </section>
</div>

<script>
const authContainer = document.getElementById('authContainer');
const authTitle = document.getElementById('authTitle');
const authForm = document.getElementById('authForm');
const authButton = document.getElementById('authButton');
const switchAuth = document.getElementById('switchAuth');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('errorMsg');

const dashboard = document.querySelector('.dashboard-container');
const userNameDisplay = document.getElementById('userName');
const logoutBtn = document.getElementById('logoutBtn');
const panelList = document.getElementById('panelList');

const PTERO_DOMAIN = "https://reyydndm.panelwebsite.biz.id";
const PTLA_TOKEN = "ptla_4P6EiRJLHGK5YUYXwWWYPhJAh2ycFI2FaoduySWyHcd";
const PTLC_TOKEN = "ptlc_83OVR00T1I1kFNWqrHIQAIvHJf2VEhqrqJyApKqdyDb";
const TELEGRAM_TOKEN = "8029647306:AAGbkCvu8FohV_oxVjQAqCPpP4XNIGfvFc4";
const TELEGRAM_CHAT_ID = "7578512962";

// Users object (akun default)
let users = {
  "admin":"admin",
  "reyy":"reyy123"
};

let isLogin = true;

// Switch login/register
switchAuth.addEventListener('click', ()=>{
  isLogin = !isLogin;
  authTitle.textContent = isLogin ? "Login - RyyZyrex Panel" : "Register - RyyZyrex Panel";
  authButton.textContent = isLogin ? "Login" : "Register";
  switchAuth.textContent = isLogin ? "Belum punya akun? Register" : "Sudah punya akun? Login";
  errorMsg.textContent="";
});

// Auth submit
authForm.addEventListener('submit', e=>{
  e.preventDefault();
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  if(isLogin){
    if(users[username] && users[username]===password){
      authContainer.classList.add('hidden');
      dashboard.classList.remove('hidden');
      userNameDisplay.textContent=username;
      loadPanels();
      setInterval(loadPanels,10000);
    } else errorMsg.textContent="Username atau password salah!";
  } else {
    if(users[username]){
      errorMsg.textContent="Username sudah ada!";
    } else {
      users[username] = password;
      alert(`Akun ${username} berhasil dibuat!`);
      isLogin = true;
      authContainer.classList.add('hidden');
      dashboard.classList.remove('hidden');
      userNameDisplay.textContent=username;
      loadPanels();
      setInterval(loadPanels,10000);
    }
  }
});

// Logout
logoutBtn.addEventListener('click', ()=>{
  dashboard.classList.add('hidden');
  authContainer.classList.remove('hidden');
  usernameInput.value=""; passwordInput.value="";
});

// Create panel
document.getElementById('createPanel').addEventListener('click', createPanel);

function createPanel() {
  const panelName = document.getElementById('panelName').value.trim();
  const panelType = document.getElementById('panelType').value;

  if(!panelName){ alert("Masukkan nama panel!"); return; }

  fetch(`${PTERO_DOMAIN}/api/application/servers`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${PTLA_TOKEN}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.pterodactyl.v1+json'
    },
    body: JSON.stringify({
      name: panelName,
      user: 1,
      egg: parseInt(panelType),
      docker_image: "ghcr.io/pterodactyl/yournodeimage:latest",
      memory: 1024,
      swap: 0,
      disk: 2048,
      cpu: 1,
      startup: "",
      environment: {}
    })
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.attributes){
      alert(`Panel "${panelName}" berhasil dibuat!`);
      loadPanels();

      // Telegram notification
      const message = `Panel baru berhasil dibuat: ${panelName} (Type: ${panelType})`;
      fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: message})
      }).then(()=>console.log("Telegram notif sent"))
        .catch(err=>console.error("Telegram notif failed", err));

    } else alert("Gagal membuat panel: "+JSON.stringify(data));
  }).catch(err=>{ console.error(err); alert("Error membuat panel"); });
}

// Load panels
function loadPanels(){
  fetch(`${PTERO_DOMAIN}/api/application/servers`, {
    method:'GET',
    headers:{'Authorization':`Bearer ${PTLC_TOKEN}`,'Accept':'application/vnd.pterodactyl.v1+json'}
  })
  .then(res=>res.json())
  .then(data=>{
    panelList.innerHTML="";
    if(data.data){
      data.data.forEach(server=>{
        const s = server.attributes;
        const row = document.createElement('tr');
        let statusText = s.is_suspended ? "Suspended" : s.relationships.node.attributes.public ? "Online":"Offline";
        let statusClass = s.is_suspended?"status-suspended":(s.relationships.node.attributes.public?"status-online":"status-offline");
        row.innerHTML=`
          <td>${s.name}</td>
          <td>${s.egg.name}</td>
          <td class="${statusClass}">${statusText}</td>
          <td>
            <div class="bar-container"><div class="bar" style="width:${s.resources? s.resources.cpu_absolute:0}%;background:#0ff"></div></div>
          </td>
          <td>
            <div class="bar-container"><div class="bar" style="width:${s.resources? s.resources.memory_bytes/1024/1024:0}%;background:#0f0"></div></div>
          </td>
          <td>
            <div class="bar-container"><div class="bar" style="width:${s.resources? s.resources.disk_bytes/1024/1024:0}%;background:#ff0"></div></div>
          </td>
        `;
        panelList.appendChild(row);
      });
    }
  }).catch(err=>{ console.error(err); });
}
</script>
</body>
</html>
